name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (skip publishing)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libelf-dev libbpf-dev pkg-config \
            linux-headers-generic python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Calculate version
        id: version
        run: |
          chmod +x scripts/version.sh
          CURRENT=$(scripts/version.sh latest)
          NEXT=$(scripts/version.sh next "${{ inputs.release_type }}")
          TAG_EXISTS=$(scripts/version.sh exists "$NEXT")

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT"
          echo "Release type:    ${{ inputs.release_type }}"
          echo "Next version:    $NEXT"
          echo "Tag exists:      $TAG_EXISTS"

          if [ "$TAG_EXISTS" = "yes" ]; then
            echo "::error::Tag $NEXT already exists"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      - name: CLI surface check
        run: |
          ./target/release/tracelet --version
          ./target/release/tracelet --help
          for cmd in exec open tcp latency top dashboard; do
            ./target/release/tracelet "$cmd" --help > /dev/null
          done

      - name: Build release artifacts
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          ARTIFACT="tracelet-${VERSION}-linux-x86_64"
          mkdir -p "dist/${ARTIFACT}"

          cp target/release/tracelet "dist/${ARTIFACT}/"
          cp README.md LICENSE "dist/${ARTIFACT}/" 2>/dev/null || cp README.md "dist/${ARTIFACT}/"

          cd dist
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"

          echo "ARTIFACT_NAME=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "ARTIFACT_TAR=dist/${ARTIFACT}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA=dist/${ARTIFACT}.tar.gz.sha256" >> "$GITHUB_ENV"

          echo "Built artifacts:"
          ls -la .

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo ""
          echo "Tracelet Release Dry Run"
          echo "------------------------"
          echo ""
          echo "Current version:  ${{ steps.version.outputs.current }}"
          echo "Release type:     ${{ inputs.release_type }}"
          echo "Next version:     ${{ steps.version.outputs.next }}"
          echo ""
          echo "Target tag:       ${{ steps.version.outputs.next }}"
          echo "Tag exists:       no"
          echo ""
          echo "Rust checks:      passed"
          echo "eBPF build:       passed"
          echo "Linux build:      passed"
          echo ""
          echo "Artifacts:"
          echo "  ${ARTIFACT_NAME}.tar.gz"
          echo "  ${ARTIFACT_NAME}.tar.gz.sha256"
          echo ""
          echo "Publishing:       SKIPPED (dry run)"
          echo ""
          echo "Result:           DRY RUN PASSED"

      - name: Update Cargo.toml versions
        if: ${{ inputs.dry_run == false }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          VERSION_NUM="${VERSION#v}"

          sed -i 's/^version = ".*"/version = "'"$VERSION_NUM"'"/' Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION_NUM"'"/' tracelet-common/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml tracelet-common/Cargo.toml

          if ! git diff --cached --quiet; then
            git commit -m "release: ${VERSION}"
          else
            echo "No Cargo.toml changes needed (already at ${VERSION_NUM})"
          fi

          git tag "$VERSION"

      - name: Push tag
        if: ${{ inputs.dry_run == false }}
        run: git push origin "${{ steps.version.outputs.next }}"

      - name: Verify tag points to HEAD
        if: ${{ inputs.dry_run == false }}
        run: |
          TAG_COMMIT=$(git rev-parse "${{ steps.version.outputs.next }}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag ${{ steps.version.outputs.next }} points to $TAG_COMMIT, expected $HEAD_COMMIT"
            exit 1
          fi
          echo "Tag verified: ${{ steps.version.outputs.next }} -> $TAG_COMMIT"

      - name: Generate release body
        if: ${{ inputs.dry_run == false }}
        id: body
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          PREV="${{ steps.version.outputs.current }}"
          SHA256=$(cat "${{ env.ARTIFACT_SHA }}" | awk '{print $1}')
          ARTIFACT_NAME="${{ env.ARTIFACT_NAME }}"

          # Collect commits since previous tag
          if [ "$PREV" != "v0.0.0" ]; then
            CHANGES=$(git log "${PREV}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          cat > release-body.md << EOF
          ## What's New

          ${CHANGES}

          ## Installation

          Download the tarball for your platform and verify the checksum:

          \`\`\`bash
          # Download
          curl -LO https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARTIFACT_NAME}.tar.gz

          # Verify checksum
          sha256sum -c ${ARTIFACT_NAME}.tar.gz.sha256

          # Extract and install
          tar xzf ${ARTIFACT_NAME}.tar.gz
          sudo mv ${ARTIFACT_NAME}/tracelet /usr/local/bin/
          \`\`\`

          ## Checksum (SHA-256)

          \`\`\`
          ${SHA256}  ${ARTIFACT_NAME}.tar.gz
          \`\`\`

          ## Platform

          - **OS:** Linux (x86_64)
          - **Kernel:** 5.8+ (BTF and tracepoint support required)
          - **Dependencies:** None (statically linked against libbpf)

          ## Quick Start

          \`\`\`bash
          # Trace process execution
          sudo tracelet exec

          # Live TUI dashboard
          sudo tracelet dashboard

          # Monitor TCP connections
          sudo tracelet tcp
          \`\`\`

          **Note:** Tracelet requires root or \`CAP_BPF\` capabilities for eBPF access.
          EOF

          # Write multiline output using delimiter
          {
            echo "content<<RELEASE_BODY_EOF"
            cat release-body.md
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: "Tracelet ${{ steps.version.outputs.next }}"
          body: ${{ steps.body.outputs.content }}
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT_TAR }}
            ${{ env.ARTIFACT_SHA }}

      - name: Release summary
        if: ${{ inputs.dry_run == false }}
        run: |
          echo ""
          echo "Tracelet Release Complete"
          echo "-------------------------"
          echo ""
          echo "Previous version: ${{ steps.version.outputs.current }}"
          echo "New version:      ${{ steps.version.outputs.next }}"
          echo "Release type:     ${{ inputs.release_type }}"
          echo "Tag:              ${{ steps.version.outputs.next }}"
          echo "Release URL:      ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.next }}"
          echo ""
          echo "Published artifacts:"
          echo "  ${ARTIFACT_NAME}.tar.gz"
          echo "  ${ARTIFACT_NAME}.tar.gz.sha256"
