[package]
name = "tracelet"
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
publish = false

[workspace]
members = ["tracelet-common"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libbpf-rs = "0.27"
ratatui = "0.30"
crossterm = "0.29"
tracelet-common = { path = "tracelet-common" }

[build-dependencies]
libbpf-cargo = "0.27"
